services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-engineering_demo}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-engineering_demo}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress-local}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wordpress_data:/var/www/html
      - ./backend/wp-content/plugins/engineering-demo-api:/var/www/html/wp-content/plugins/engineering-demo-api:ro

  wp-cli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ["sh"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-engineering_demo}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress-local}
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-Tuluzov Engineering Demo}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-demo_admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-change-me-before-sharing}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-demo@example.com}
    volumes:
      - wordpress_data:/var/www/html
      - ./backend/wp-content/plugins/engineering-demo-api:/var/www/html/wp-content/plugins/engineering-demo-api:ro
      - ./scripts:/scripts:ro
    working_dir: /var/www/html

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_WORDPRESS_URL: ${NEXT_PUBLIC_WORDPRESS_URL:-http://localhost:8080}
      WORDPRESS_INTERNAL_URL: ${WORDPRESS_INTERNAL_URL:-http://wordpress}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  db_data:
  wordpress_data:
  frontend_node_modules:
  frontend_next:
