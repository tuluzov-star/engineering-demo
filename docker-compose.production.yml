services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }
        define( 'WP_ENVIRONMENT_TYPE', 'production' );
        define( 'WP_DEBUG', false );
        define( 'WP_DEBUG_LOG', false );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'FORCE_SSL_ADMIN', true );
    volumes:
      - wordpress_data:/var/www/html
      - ./backend/wp-content/plugins/engineering-demo-api:/var/www/html/wp-content/plugins/engineering-demo-api:ro
    expose:
      - "80"
    networks:
      - edge
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$s=@fsockopen("127.0.0.1",80); exit($s ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 30

  wp-cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    entrypoint: ["sh"]
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WP_URL: https://${WORDPRESS_HOST}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wordpress_data:/var/www/html
      - ./backend/wp-content/plugins/engineering-demo-api:/var/www/html/wp-content/plugins/engineering-demo-api:ro
      - ./scripts:/scripts:ro
    working_dir: /var/www/html
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_WORDPRESS_URL: https://${WORDPRESS_HOST}
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_WORDPRESS_URL: https://${WORDPRESS_HOST}
      WORDPRESS_INTERNAL_URL: http://wordpress
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - edge
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST}
      WORDPRESS_HOST: ${WORDPRESS_HOST}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

volumes:
  db_data:
  wordpress_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
