name: CI

on:
  push:
    branches: ['main', 'develop', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Next.js quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_WORDPRESS_URL: http://localhost:8080
      WORDPRESS_INTERNAL_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: PHP and shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php -l backend/wp-content/plugins/engineering-demo-api/engineering-demo-api.php
      - run: php -l scripts/seed-products.php
      - run: bash -n scripts/bootstrap-wp.sh
      - run: bash -n scripts/init.sh

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
