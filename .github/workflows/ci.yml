name: CI

on:
  push:
    branches: ['main', 'develop', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Next.js quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_WORDPRESS_URL: http://localhost:8080
      WORDPRESS_INTERNAL_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: PHP and shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php -l backend/wp-content/plugins/engineering-demo-api/engineering-demo-api.php
      - run: php -l scripts/seed-products.php
      - run: php -l scripts/configure-store.php
      - run: php -l scripts/verify-order.php
      - run: bash -n scripts/bootstrap-wp.sh
      - run: bash -n scripts/init.sh
      - run: bash -n scripts/smoke-test.sh
      - run: bash -n scripts/backup-production.sh
      - run: bash -n scripts/deploy-production.sh
      - run: bash -n scripts/rollback-production.sh

  compose:
    name: Docker configuration and production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate production Compose
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e FRONTEND_HOST=lab.tuluzov.com \
            -e WORDPRESS_HOST=cms.lab.tuluzov.com \
            -e TLS_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build production frontend image
        run: docker compose --env-file .env.production -f docker-compose.production.yml build frontend

  integration:
    name: Docker commerce + browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cp .env.example .env
      - name: Start application stack
        run: docker compose up -d --build db wordpress frontend
      - name: Bootstrap WordPress and WooCommerce
        run: docker compose run --rm wp-cli /scripts/bootstrap-wp.sh
      - name: Run API cart, checkout and HPOS smoke test
        run: sh scripts/smoke-test.sh
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run Playwright headless commerce flow
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Show service state
        if: always()
        run: docker compose ps || true
      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 db wordpress frontend || true
      - name: Remove integration environment
        if: always()
        run: docker compose down -v --remove-orphans || true
